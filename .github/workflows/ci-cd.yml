name: SleepWise CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '20.x'
  PYTHON_VERSION: '3.11'

jobs:
  # Mobile App CI
  mobile-ci:
    name: Mobile App - Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        working-directory: ./mobile
        run: npm ci

      - name: Lint code
        working-directory: ./mobile
        run: npm run lint

      - name: Type check
        working-directory: ./mobile
        run: npm run type-check

      - name: Run tests
        working-directory: ./mobile
        run: npm run test:ci

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./mobile/coverage/lcov.info
          flags: mobile
          name: mobile-coverage

  # Backend CI
  backend-ci:
    name: Backend Services - Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: timescale/timescaledb:latest-pg15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: sleepwise_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: ./backend
        run: npm ci

      - name: Setup database
        working-directory: ./backend/shared
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/sleepwise_test
        run: |
          npm run migrate
          npm run seed

      - name: Test Auth Service
        working-directory: ./backend/services/auth
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/sleepwise_test
          JWT_SECRET: test_secret
          JWT_REFRESH_SECRET: test_refresh_secret
        run: |
          npm ci
          npm run test:ci

      - name: Test Sleep Service
        working-directory: ./backend/services/sleep
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/sleepwise_test
          REDIS_URL: redis://localhost:6379
          AWS_REGION: us-east-1
          S3_BUCKET: test-bucket
          ML_SERVICE_URL: http://localhost:8000
        run: |
          npm ci
          npm run test:ci

      - name: Test Family Service
        working-directory: ./backend/services/family
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/sleepwise_test
          SMTP_HOST: smtp.test.com
          SMTP_USER: test@example.com
        run: |
          npm ci
          npm run test:ci

      - name: Upload Auth Service Coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./backend/services/auth/coverage/lcov.info
          flags: backend-auth
          name: auth-service-coverage

      - name: Upload Sleep Service Coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./backend/services/sleep/coverage/lcov.info
          flags: backend-sleep
          name: sleep-service-coverage

      - name: Upload Family Service Coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./backend/services/family/coverage/lcov.info
          flags: backend-family
          name: family-service-coverage

  # ML Models CI
  ml-ci:
    name: ML Models - Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: ml/requirements.txt

      - name: Install dependencies
        working-directory: ./ml
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint with flake8
        working-directory: ./ml
        run: |
          pip install flake8
          flake8 models/ inference/ --max-line-length=100 --ignore=E501,W503

      - name: Type check with mypy
        working-directory: ./ml
        run: |
          pip install mypy
          mypy models/ inference/ --ignore-missing-imports || true

      - name: Run tests
        working-directory: ./ml
        run: |
          pytest tests/ --cov=models --cov=inference --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./ml/coverage.xml
          flags: ml
          name: ml-coverage

  # Security Scan
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'

  # Docker Build
  docker-build:
    name: Docker - Build & Push
    runs-on: ubuntu-latest
    needs: [mobile-ci, backend-ci, ml-ci]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push ML service
        uses: docker/build-push-action@v5
        with:
          context: ./ml
          push: true
          tags: sleepwise/ml-service:latest,sleepwise/ml-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Auth service
        uses: docker/build-push-action@v5
        with:
          context: ./backend/services/auth
          push: true
          tags: sleepwise/auth-service:latest,sleepwise/auth-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Deploy to Staging
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.ref == 'refs/heads/develop'
    environment:
      name: staging
      url: https://staging.sleepwise.app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy to ECS
        run: |
          echo "Deploying to staging ECS cluster..."
          # Add ECS deployment commands here
          # aws ecs update-service --cluster sleepwise-staging --service ml-service --force-new-deployment

  # Deploy to Production
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://api.sleepwise.app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_PROD }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_PROD }}
          aws-region: us-east-1

      - name: Deploy to ECS
        run: |
          echo "Deploying to production ECS cluster..."
          # Add ECS deployment commands here

      - name: Notify Slack
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: 'SleepWise deployed to production'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
        if: always()
