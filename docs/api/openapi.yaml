openapi: 3.0.3
info:
  title: SleepWise API
  description: |
    API completa para la plataforma SleepWise de seguimiento del sueño con IA.

    ## Características
    - Análisis de audio mediante IA para detección de fases del sueño
    - Predicciones de calidad del sueño y riesgo de apnea
    - Dashboard familiar para monitoreo de seres queridos
    - Analytics corporativo para wellness empresarial
    - Integración con Apple HealthKit y Google Fit

    ## Autenticación
    La API usa JWT (JSON Web Tokens) para autenticación. Incluye el token en el header:
    ```
    Authorization: Bearer {token}
    ```

    ## Rate Limiting
    - 100 requests por 15 minutos (general)
    - 10 requests por 15 minutos (auth endpoints)

    ## Códigos de Error
    - `400` - Bad Request (validación fallida)
    - `401` - Unauthorized (no autenticado)
    - `402` - Payment Required (requiere suscripción premium)
    - `403` - Forbidden (sin permisos)
    - `404` - Not Found
    - `409` - Conflict (recurso ya existe)
    - `429` - Too Many Requests
    - `500` - Internal Server Error

  version: 1.0.0
  contact:
    name: SleepWise API Support
    email: api@sleepwise.app
    url: https://docs.sleepwise.app
  license:
    name: Proprietary
    url: https://sleepwise.app/license

servers:
  - url: https://api.sleepwise.app/v1
    description: Production server
  - url: https://api-staging.sleepwise.app/v1
    description: Staging server
  - url: http://localhost:3000/api/v1
    description: Development server

tags:
  - name: Authentication
    description: Registro, login y gestión de usuarios
  - name: Sleep Sessions
    description: Gestión de sesiones de sueño
  - name: Analytics
    description: Análisis y reportes de sueño
  - name: Subscriptions
    description: Gestión de suscripciones y pagos
  - name: Family
    description: Features de monitoreo familiar
  - name: Corporate
    description: Dashboard corporativo
  - name: ML Predictions
    description: Predicciones de IA

paths:
  # Authentication endpoints
  /auth/register:
    post:
      tags:
        - Authentication
      summary: Registrar nuevo usuario
      description: Crea una nueva cuenta de usuario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
                - name
              properties:
                email:
                  type: string
                  format: email
                  example: usuario@example.com
                password:
                  type: string
                  format: password
                  minLength: 8
                  example: Password123!
                  description: Mínimo 8 caracteres, incluir mayúscula, minúscula y número
                name:
                  type: string
                  minLength: 2
                  example: Juan Pérez
                dateOfBirth:
                  type: string
                  format: date
                  example: 1990-01-15
                gender:
                  type: string
                  enum: [male, female, other, prefer_not_to_say]
                  example: male
      responses:
        '201':
          description: Usuario registrado exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      user:
                        $ref: '#/components/schemas/User'
                      token:
                        type: string
                        description: JWT access token
                      refreshToken:
                        type: string
                        description: JWT refresh token
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/ConflictError'

  /auth/login:
    post:
      tags:
        - Authentication
      summary: Iniciar sesión
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Login exitoso
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      user:
                        $ref: '#/components/schemas/User'
                      token:
                        type: string
                      refreshToken:
                        type: string
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /auth/logout:
    post:
      tags:
        - Authentication
      summary: Cerrar sesión
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logout exitoso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  # Sleep Sessions endpoints
  /sleep/sessions/start:
    post:
      tags:
        - Sleep Sessions
      summary: Iniciar sesión de sueño
      description: Inicia una nueva grabación de sueño
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Sesión iniciada
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/SleepSession'

  /sleep/sessions/{sessionId}/stop:
    post:
      tags:
        - Sleep Sessions
      summary: Detener sesión de sueño
      security:
        - bearerAuth: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Sesión detenida
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/SleepSession'

  /sleep/sessions:
    get:
      tags:
        - Sleep Sessions
      summary: Obtener sesiones de sueño
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 30
            maximum: 100
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Lista de sesiones
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/SleepSession'
                      total:
                        type: integer
                      page:
                        type: integer
                      pageSize:
                        type: integer

  # Analytics endpoints
  /sleep/analytics:
    get:
      tags:
        - Analytics
      summary: Obtener analytics del sueño
      security:
        - bearerAuth: []
      parameters:
        - name: period
          in: query
          schema:
            type: string
            enum: [week, month, year]
            default: week
      responses:
        '200':
          description: Analytics del usuario
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Analytics'

  # Subscription endpoints
  /subscriptions/plans:
    get:
      tags:
        - Subscriptions
      summary: Obtener planes de suscripción
      responses:
        '200':
          description: Lista de planes disponibles
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      plans:
                        type: array
                        items:
                          $ref: '#/components/schemas/SubscriptionPlan'

  /subscriptions/checkout:
    post:
      tags:
        - Subscriptions
      summary: Crear sesión de checkout
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - priceId
                - successUrl
                - cancelUrl
                - tier
                - billingPeriod
              properties:
                priceId:
                  type: string
                  description: Stripe Price ID
                successUrl:
                  type: string
                  format: uri
                cancelUrl:
                  type: string
                  format: uri
                tier:
                  type: string
                  enum: [PREMIUM, FAMILY]
                billingPeriod:
                  type: string
                  enum: [monthly, annual]
      responses:
        '200':
          description: Sesión de checkout creada
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      sessionId:
                        type: string
                      url:
                        type: string
                        format: uri

  # ML Predictions endpoints
  /ml/analyze/audio:
    post:
      tags:
        - ML Predictions
      summary: Analizar audio de sueño
      description: Envía audio para análisis de fases y eventos del sueño
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - sessionId
                - audio_file
              properties:
                sessionId:
                  type: string
                  format: uuid
                audio_file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Análisis completado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AudioAnalysisResult'

  /ml/predict/sleep-quality:
    post:
      tags:
        - ML Predictions
      summary: Predecir calidad del sueño
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - userId
                - historicalData
              properties:
                userId:
                  type: string
                historicalData:
                  type: array
                  description: Últimos 30 días de datos
                  items:
                    type: object
      responses:
        '200':
          description: Predicción generada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SleepQualityPrediction'

# Components
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        dateOfBirth:
          type: string
          format: date
        gender:
          type: string
        subscriptionTier:
          type: string
          enum: [FREE, PREMIUM, FAMILY, CORPORATE]
        role:
          type: string
          enum: [USER, FAMILY_ADMIN, CORPORATE_ADMIN]
        createdAt:
          type: string
          format: date-time

    SleepSession:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        duration:
          type: integer
          description: Duración en minutos
        sleepScore:
          type: integer
          minimum: 0
          maximum: 100
        efficiency:
          type: number
          minimum: 0
          maximum: 100
        status:
          type: string
          enum: [RECORDING, PROCESSING, COMPLETED, FAILED]
        phases:
          type: array
          items:
            $ref: '#/components/schemas/SleepPhase'
        events:
          type: array
          items:
            $ref: '#/components/schemas/SleepEvent'

    SleepPhase:
      type: object
      properties:
        id:
          type: string
        phase:
          type: string
          enum: [AWAKE, REM, LIGHT, DEEP]
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        duration:
          type: integer
        confidence:
          type: number
          minimum: 0
          maximum: 1

    SleepEvent:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum: [SNORING, APNEA, MOVEMENT, AWAKENING, OTHER]
        timestamp:
          type: string
          format: date-time
        duration:
          type: integer
        severity:
          type: string
          enum: [LOW, MEDIUM, HIGH]
        confidence:
          type: number

    Analytics:
      type: object
      properties:
        userId:
          type: string
        period:
          type: string
        averageSleepScore:
          type: number
        averageDuration:
          type: number
        averageEfficiency:
          type: number
        phaseDistribution:
          type: object
        eventCounts:
          type: object
        trends:
          type: object
          properties:
            sleepScore:
              type: array
            duration:
              type: array
            efficiency:
              type: array
        insights:
          type: array
          items:
            $ref: '#/components/schemas/Insight'

    Insight:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum: [positive, negative, neutral, warning]
        title:
          type: string
        description:
          type: string
        actionable:
          type: boolean
        actions:
          type: array
          items:
            type: string
        priority:
          type: string
          enum: [low, medium, high]

    SubscriptionPlan:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        tier:
          type: string
        price:
          type: object
          properties:
            monthly:
              type: number
            annual:
              type: number
        features:
          type: array
          items:
            type: string

    AudioAnalysisResult:
      type: object
      properties:
        sessionId:
          type: string
        sleepPhases:
          type: array
          items:
            type: object
        events:
          type: array
          items:
            type: object
        summary:
          type: object
        processingTime:
          type: number

    SleepQualityPrediction:
      type: object
      properties:
        predictedScore:
          type: number
        confidence:
          type: number
        lowerBound:
          type: number
        upperBound:
          type: number
        factors:
          type: array
          items:
            type: string

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object

  responses:
    ValidationError:
      description: Error de validación
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: VALIDATION_ERROR
              message: Invalid input data

    UnauthorizedError:
      description: No autenticado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: UNAUTHORIZED
              message: Authentication required

    ConflictError:
      description: Recurso ya existe
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error:
              code: CONFLICT
              message: Resource already exists
